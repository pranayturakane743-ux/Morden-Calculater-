<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1: #12141a;
    --bg-2: #1a1d24;
    --panel: #1e222b;
    --panel-edge: #2a2f3a;
    --brass: #c9a15c;
    --brass-bright: #e8c98a;
    --brass-dim: #8a713f;
    --ivory: #f2ead9;
    --ink: #eae6dc;
    --muted: #8b8f9b;
    --teal: #5b8a86;
    --shadow-deep: rgba(0,0,0,0.55);
    --radius-panel: 28px;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
  }

  body{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, #23283380, transparent),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 60%);
    font-family: 'Manrope', sans-serif;
    padding: 32px 16px;
  }

  .stage{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--brass-dim);
    letter-spacing: 0.32em;
    font-size: 11px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .brand::before, .brand::after{
    content: "";
    width: 22px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--brass-dim));
  }
  .brand::after{ background: linear-gradient(90deg, var(--brass-dim), transparent); }

  .calculator{
    width: 340px;
    max-width: 100%;
    border-radius: var(--radius-panel);
    padding: 22px;
    background: linear-gradient(155deg, #23272f, #181b21 55%, #14161b);
    box-shadow:
      0 40px 80px -20px var(--shadow-deep),
      0 2px 0 0 rgba(255,255,255,0.03) inset,
      0 0 0 1px var(--panel-edge);
    position: relative;
  }

  .calculator::before{
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: calc(var(--radius-panel) - 10px);
    border: 1px solid rgba(201,161,92,0.08);
    pointer-events: none;
  }

  /* ---- Display ---- */
  .display-bezel{
    position: relative;
    border-radius: 16px;
    padding: 3px;
    background: linear-gradient(160deg, var(--brass-dim), #4a3d24 40%, var(--brass) 100%);
    margin-bottom: 20px;
    box-shadow: 0 10px 24px -10px rgba(0,0,0,0.6);
  }

  .display{
    border-radius: 13px;
    background: linear-gradient(180deg, #10131a, #0c0e13);
    box-shadow: inset 0 3px 10px rgba(0,0,0,0.65), inset 0 -1px 0 rgba(255,255,255,0.03);
    padding: 22px 20px 18px;
    min-height: 108px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 6px;
    overflow: hidden;
  }

  .display-history{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
    min-height: 16px;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.85;
  }

  .display-main{
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 300;
    font-size: 42px;
    color: var(--ivory);
    text-align: right;
    letter-spacing: 0.01em;
    line-height: 1.1;
    text-shadow: 0 0 18px rgba(232,201,138,0.18);
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .display-main::-webkit-scrollbar{ display: none; }

  .mem-flag{
    position: absolute;
    top: -9px;
    left: 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: #0c0e13;
    background: var(--brass);
    padding: 2px 7px;
    border-radius: 5px;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .mem-flag.show{ opacity: 1; transform: translateY(0); }

  /* ---- Keypad ---- */
  .keypad{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button.key{
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    height: 62px;
    border-radius: 14px;
    position: relative;
    background: linear-gradient(160deg, #2b303b, #20242c);
    box-shadow:
      0 3px 0 0 #14161b,
      0 8px 14px -6px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.05);
    transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.15s ease;
  }
  button.key span{ position: relative; z-index: 1; }

  button.key:hover{ background: linear-gradient(160deg, #313644, #252a33); }

  button.key:active{
    transform: translateY(3px);
    box-shadow:
      0 0px 0 0 #14161b,
      0 3px 6px -3px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }

  button.key.util{
    color: var(--teal);
    font-size: 15px;
    background: linear-gradient(160deg, #262b33, #1c2027);
  }

  button.key.op{
    color: #0c0e13;
    background: linear-gradient(160deg, var(--brass-bright), var(--brass));
    box-shadow:
      0 3px 0 0 var(--brass-dim),
      0 8px 16px -6px rgba(201,161,92,0.35),
      inset 0 1px 0 rgba(255,255,255,0.35);
    font-size: 20px;
    font-weight: 600;
  }
  button.key.op:hover{ background: linear-gradient(160deg, #f0d59a, #d4ad68); }
  button.key.op:active{
    transform: translateY(3px);
    box-shadow:
      0 0 0 0 var(--brass-dim),
      0 3px 8px -3px rgba(201,161,92,0.35),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }

  button.key.equals{
    grid-row: span 2;
    height: auto;
    background: linear-gradient(160deg, #6a9490, var(--teal));
    color: #0c0e13;
    box-shadow:
      0 3px 0 0 #3d5d5a,
      0 8px 16px -6px rgba(91,138,134,0.35),
      inset 0 1px 0 rgba(255,255,255,0.25);
  }
  button.key.equals:hover{ background: linear-gradient(160deg, #78a29e, #5b8a86); }
  button.key.equals:active{
    transform: translateY(3px);
    box-shadow: 0 0 0 0 #3d5d5a, 0 3px 8px -3px rgba(91,138,134,0.35);
  }

  button.key.zero{ grid-column: span 2; }

  /* ripple */
  .ripple{
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transform: scale(0);
    animation: ripple-anim 0.5s ease-out forwards;
    pointer-events: none;
  }
  @keyframes ripple-anim{
    to{ transform: scale(2.6); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    button.key{ transition: none; }
    .ripple{ animation: none; display: none; }
  }

  @media (max-width: 380px){
    .calculator{ width: 100%; padding: 16px; }
    .display-main{ font-size: 34px; }
    button.key{ height: 54px; font-size: 15px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="brand">Meridian</div>

  <div class="calculator">
    <div class="display-bezel">
      <div class="display">
        <div class="mem-flag" id="memFlag">M</div>
        <div class="display-history" id="history">&nbsp;</div>
        <div class="display-main" id="main">0</div>
      </div>
    </div>

    <div class="keypad" id="keypad">
      <button class="key util" data-action="clear"><span>AC</span></button>
      <button class="key util" data-action="sign"><span>±</span></button>
      <button class="key util" data-action="percent"><span>%</span></button>
      <button class="key op" data-op="÷"><span>÷</span></button>

      <button class="key" data-num="7"><span>7</span></button>
      <button class="key" data-num="8"><span>8</span></button>
      <button class="key" data-num="9"><span>9</span></button>
      <button class="key op" data-op="×"><span>×</span></button>

      <button class="key" data-num="4"><span>4</span></button>
      <button class="key" data-num="5"><span>5</span></button>
      <button class="key" data-num="6"><span>6</span></button>
      <button class="key op" data-op="−"><span>−</span></button>

      <button class="key" data-num="1"><span>1</span></button>
      <button class="key" data-num="2"><span>2</span></button>
      <button class="key" data-num="3"><span>3</span></button>
      <button class="key op" data-op="+"><span>+</span></button>

      <button class="key zero" data-num="0"><span>0</span></button>
      <button class="key" data-action="decimal"><span>.</span></button>
      <button class="key equals" data-action="equals"><span>=</span></button>
    </div>
  </div>
</div>

<script>
(function(){
  const mainEl = document.getElementById('main');
  const histEl = document.getElementById('history');
  const memFlag = document.getElementById('memFlag');
  const keypad = document.getElementById('keypad');

  let current = '0';
  let previous = null;
  let operator = null;
  let overwrite = true;
  let memory = 0;

  function formatDisplay(numStr){
    if (numStr === 'Error') return numStr;
    let neg = numStr.startsWith('-');
    let s = neg ? numStr.slice(1) : numStr;
    let [intPart, decPart] = s.split('.');
    intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    let out = intPart + (decPart !== undefined ? '.' + decPart : '');
    return (neg ? '-' : '') + out;
  }

  function render(){
    mainEl.textContent = formatDisplay(current);
    memFlag.classList.toggle('show', memory !== 0);
  }

  function inputNum(d){
    if (overwrite){
      current = (d === '.') ? '0.' : d;
      overwrite = false;
      return;
    }
    if (d === '.' && current.includes('.')) return;
    if (current === '0' && d !== '.') { current = d; return; }
    if (current.replace(/[-.]/g,'').length >= 15) return;
    current += d;
  }

  function compute(a, b, op){
    a = parseFloat(a); b = parseFloat(b);
    switch(op){
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function setOperator(op){
    if (operator && !overwrite){
      const result = compute(previous, current, operator);
      current = Number.isFinite(result) ? trim(result) : 'Error';
      render();
    }
    previous = current;
    operator = op;
    overwrite = true;
    histEl.textContent = `${formatDisplay(previous)} ${operator}`;
  }

  function trim(n){
    if (!Number.isFinite(n)) return 'Error';
    let s = n.toPrecision(12);
    if (s.includes('.')) s = s.replace(/0+$/,'').replace(/\.$/,'');
    if (Math.abs(n) < 1e-9) s = '0';
    return s;
  }

  function equals(){
    if (operator === null || previous === null) return;
    histEl.textContent = `${formatDisplay(previous)} ${operator} ${formatDisplay(current)} =`;
    const result = compute(previous, current, operator);
    current = Number.isFinite(result) ? trim(result) : 'Error';
    operator = null;
    previous = null;
    overwrite = true;
  }

  function clearAll(){
    current = '0'; previous = null; operator = null; overwrite = true;
    histEl.textContent = '\u00a0';
  }

  function toggleSign(){
    if (current === '0') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
  }

  function percent(){
    current = trim(parseFloat(current) / 100);
    overwrite = true;
  }

  function flash(btn){
    const rect = btn.getBoundingClientRect();
    const r = document.createElement('span');
    r.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    r.style.width = r.style.height = size + 'px';
    r.style.left = (rect.width/2 - size/2) + 'px';
    r.style.top = (rect.height/2 - size/2) + 'px';
    btn.appendChild(r);
    setTimeout(()=> r.remove(), 500);
  }

  keypad.addEventListener('click', (e) => {
    const btn = e.target.closest('button.key');
    if (!btn) return;
    flash(btn);

    if (btn.dataset.num !== undefined){
      inputNum(btn.dataset.num);
    } else if (btn.dataset.op){
      setOperator(btn.dataset.op);
    } else {
      switch(btn.dataset.action){
        case 'clear': clearAll(); break;
        case 'sign': toggleSign(); break;
        case 'percent': percent(); break;
        case 'decimal': inputNum('.'); break;
        case 'equals': equals(); break;
      }
    }
    render();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9'){ inputNum(e.key); render(); }
    else if (e.key === '.'){ inputNum('.'); render(); }
    else if (e.key === '+'){ setOperator('+'); render(); }
    else if (e.key === '-'){ setOperator('−'); render(); }
    else if (e.key === '*'){ setOperator('×'); render(); }
    else if (e.key === '/'){ e.preventDefault(); setOperator('÷'); render(); }
    else if (e.key === 'Enter' || e.key === '='){ equals(); render(); }
    else if (e.key === 'Escape'){ clearAll(); render(); }
    else if (e.key === '%'){ percent(); render(); }
    else if (e.key === 'Backspace'){
      current = current.length > 1 ? current.slice(0,-1) : '0';
      if (current === '-') current = '0';
      render();
    }
  });

  render();
})();
</script>

</body>
</html>
